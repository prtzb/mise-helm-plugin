suite: configmap
templates:
  - configmap.yaml
tests:
  - it: takes the greeting from values
    asserts:
      - equal:
          path: data.greeting
          value: hello

  - it: prefixes the name with the release
    release:
      name: demo
    set:
      greeting: hi
    asserts:
      - equal:
          path: metadata.name
          value: demo-config
      - equal:
          path: data.greeting
          value: hi
