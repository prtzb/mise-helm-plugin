# helm 4 + a helm-secrets release that works on helm 4.
#
# helm 4 refuses a plugin.yaml setting both `command` and `platformCommand`, so
# 4.6.5+ is required here — example/1's 4.6.0 fails with "both platformCommand
# and command are set".
#
# helm 4 also verifies plugin signatures and rejects git sources; the backend
# detects the major version and passes --verify=false, so this needs no setup.
[tools]
helm = "4"
"helm-plugin:helm-diff" = "3.10.0"
"helm-plugin:helm-secrets" = "4.7.7"

[env]
HELM_PLUGINS = "{{xdg_state_home}}/helm-plugins/{{ config_root | basename }}-{{ config_root | hash(len=8) }}"

[hooks]
enter = "helm-plugins-sync"
