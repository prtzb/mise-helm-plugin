[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
# helm-plugins-sync needs jq at runtime; the tests exercise it, so CI needs it
# too rather than relying on the runner image happening to ship it.
jq = "latest"
lua = "5.4"
lua-language-server = "latest"
pkl = "latest"
shellcheck = "latest"
stylua = "latest"
# Hard dependency of the backend itself, not just of the dev tooling.
helm = "latest"

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
# --all, not the default: plain `hk check` only looks at git-modified files, so
# on CI's clean checkout it finds nothing and passes vacuously. The pre-commit
# hook in hk.pkl still runs against modified files only, which is right there.
run = "hk check --all"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix --all"

[tasks.test]
description = "Run all end-to-end tests (needs network; installs real helm plugins)"
# Sequential rather than `depends`, which would run them in parallel: all three
# call `mise plugin link --force helm-plugin` against the same global path, and
# two of them install into the shared data dir. Racing on that is asking for
# intermittent failures no one can reproduce.
run = [
    "mise run test-activation",
    "mise run test-sync-hardening",
    "mise run test-activate-hook",
]

[tasks.ci]
description = "Run the fast, hermetic checks"
# Deliberately lint-only, so it stays quick to run locally and needs no network.
# The end-to-end tests are a separate `test` job in .github/workflows/ci.yml —
# they install real helm plugins over the network, which is worth doing on CI
# but not on every local invocation.
depends = ["lint"]
