[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
lua = "5.4"
lua-language-server = "latest"
pkl = "latest"
stylua = "latest"
# Hard dependency of the backend itself, not just of the dev tooling.
helm = "latest"

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
# --all, not the default: plain `hk check` only looks at git-modified files, so
# on CI's clean checkout it finds nothing and passes vacuously. The pre-commit
# hook in hk.pkl still runs against modified files only, which is right there.
run = "hk check --all"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix --all"

[tasks.ci]
description = "Run all CI checks"
# Note: test-env-merge is deliberately not part of CI — it needs network access
# and installs real helm plugins.
depends = ["lint"]
