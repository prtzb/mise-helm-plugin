[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
lua = "5.4"
lua-language-server = "latest"
pkl = "latest"
shellcheck = "latest"
stylua = "latest"
# Hard dependency of the backend itself, not just of the dev tooling.
helm = "latest"

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
# --all, not the default: plain `hk check` looks only at git-modified files, so
# on CI's clean checkout it would pass vacuously.
run = "hk check --all"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix --all"

[tasks.test]
description = "Run all end-to-end tests (needs network; installs real helm plugins)"
# Sequential rather than `depends`, which runs them in parallel: all three link
# the plugin at the same global path, and two share a data dir.
run = [
    "mise run test-activation",
    "mise run test-sync-hardening",
    "mise run test-activate-hook",
    "mise run test-shim-install",
]

[tasks.ci]
description = "Run the fast, hermetic checks"
# Lint-only, so it stays quick and needs no network. The end-to-end tests are a
# separate job in .github/workflows/ci.yml.
depends = ["lint"]
